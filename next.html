<html>
    <style>
        body {
            background: rgb(0, 26, 8);
            color:white;
        }
        .header {
            font-size: 0.8rem;
            text-align: center;
            margin-top: 0%;
        }
        h1 {
            font-size: 2rem;
            text-align: center;
            margin-bottom: 1px;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            font-size: clamp(18px, 2vw, 26px);
        }
        h1 {
            font-size: clamp(40px, 6vw, 80px);
        }
        h2 {
            font-size: clamp(28px, 4vw, 55px);
        }

        button {
            font-size: clamp(18px, 2vw, 26px);
            padding: 18px 35px;
            cursor: pointer;
        }

        p {
            font-size: clamp(18px, 2vw, 25px);
            line-height: 1.6;
        }
        .terminal-bar {
            display:flex;
            justify-content: space-between;
            gap:2%;
            padding: 1.5% 2%;
            background: #16351f;
            color: #a5ffb5;
            font-size: clamp(10px, 1vw, 14px);
        }
        .terminal-screen {
            height: 45vh;
            min-height: 230px;
            overflow-y: auto;
            padding: 3%;
            color: #90ffac;
            font-size: clamp(12px, 1.1vw, 17px);
            line-height: 1.6;
            margin-bottom: 1px;
            overflow-wrap: anywhere;
        }
    </style>
    <main>
        <span class="header">COVID.exe</span>
        <h1>Start of 2020</h1>
        <p class="header">January, February, March</p>
        <div class="terminal">
            <div class="terminal-bar">
                <span>$$$</span>
                <span>COVID.exe - Historical Archive</span>
                <span id="terminal-date">JAN 2020</span>
            </div>
            <div class="terminal-screen">
                <p>COVID.exe [version 1.0]</p>
                <p>Historical Investigation System</p>
                <p>Initializing Archive...</p>
                <p>Current Perood: January 2020</p>
                <p>Type HELP to begin</p>
            </div>
        </div>
        
    </main>
    <script>
    </script>
</html>
